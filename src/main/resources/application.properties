
spring.application.name=neon-cache-demo
server.port=8080

# Neon PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-muddy-surf-b513hbq0-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Prevent Hibernate from connecting during startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# Logging
logging.level.com.example.neoncache=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.orm.jpa=INFO
